<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rainbow">
  <meta name="description" content="Найдите радугу! PWA с компасом, анализом погоды и научным расчётом вероятности радуги.">
  
  <title>Rainbow Finder</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  
  <link rel="stylesheet" href="/css/style.css?v=14">
</head>
<body>
  <div id="app" class="theme-day">

    <!-- ========== ЭКРАН ОШИБКИ ========== -->
    <div id="error-screen" class="screen">
      <div class="screen-content">
        <div class="error-icon">&#9888;</div>
        <h2>Не удалось запустить</h2>
        <p id="error-message"></p>
        <button class="btn-primary" onclick="location.reload()">Попробовать снова</button>
      </div>
    </div>

    <!-- ========== ОСНОВНОЙ ЭКРАН ========== -->
    <div id="main-screen" class="screen active">
      
      <!-- Верхняя панель: погода -->
      <header class="weather-bar">
        <div class="weather-left">
          <span id="weather-icon-text" class="weather-emoji"></span>
          <div>
            <div id="city-name" class="city-name">Загрузка...</div>
            <div id="weather-desc" class="weather-desc"></div>
          </div>
        </div>
        <div class="weather-right">
          <span id="weather-temp" class="weather-temp">--</span>
        </div>
      </header>

      <!-- Компас + колокольчик -->
      <section class="compass-section">
        <button id="notif-btn" class="notif-bell" aria-label="Уведомления">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <div class="compass-container">
          <canvas id="compass-canvas"></canvas>
        </div>
        <div class="heading-badge">
          <span id="heading-value">0° С</span>
        </div>
        <div id="ios-hint" class="ios-hint" style="display:none;">
          Нажмите на экран, чтобы активировать компас
        </div>
      </section>

      <!-- Вероятность -->
      <section class="probability-section">
        <div class="probability-card">
          <div class="probability-header">
            <span id="probability-value" class="probability-number prob-none">0%</span>
            <span id="probability-label" class="probability-text">Анализ...</span>
          </div>
          <div class="probability-bar">
            <div id="probability-fill" class="probability-bar-fill"></div>
          </div>
        </div>
      </section>

      <!-- Направление -->
      <section class="direction-section">
        <div class="direction-card">
          <div id="direction-text" class="direction-main">Определение...</div>
          <div id="direction-details" class="direction-sub"></div>
        </div>
      </section>

      <!-- Детали -->
      <section class="details-section">
        <details class="details-panel">
          <summary class="details-toggle">Подробная информация</summary>
          
          <div class="details-grid">
            <div class="detail-item">
              <span class="detail-label">Высота Солнца</span>
              <span id="sun-altitude" class="detail-value">—</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Азимут Солнца</span>
              <span id="sun-azimuth" class="detail-value">—</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Влажность</span>
              <span id="humidity-value" class="detail-value">—</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Ветер</span>
              <span id="wind-value" class="detail-value">—</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Облачность</span>
              <span id="clouds-value" class="detail-value">—</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Видимость</span>
              <span id="visibility-value" class="detail-value">—</span>
            </div>
          </div>
          
          <h3 class="factors-title">Факторы вероятности</h3>
          <div id="factor-list" class="factor-list"></div>
        </details>
      </section>

      <!-- Цитата дня -->
      <footer class="quote-footer">
        <div class="quote-card">
          <div class="quote-mark">&laquo;</div>
          <p id="quote-text" class="quote-text"></p>
          <div class="quote-mark quote-mark-end">&raquo;</div>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="/js/app.js?v=14"></script>
</body>
</html>
